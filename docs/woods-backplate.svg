<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" font-family="Helvetica,Arial,sans-serif">
<style>
  .box{fill:#fff;stroke:#333;stroke-width:2;rx:6}
  .hdr{fill:#eef3fb;stroke:#2b5fa8;stroke-width:2;rx:6}
  .rf{fill:#eafaf1;stroke:#1e8a5a;stroke-width:2;rx:6}
  .gps{fill:#fff4e6;stroke:#c47a1a;stroke-width:2;rx:6}
  .bat{fill:#fdeaea;stroke:#b03030;stroke-width:2;rx:6}
  .t{font-size:13px;fill:#111}
  .ts{font-size:11px;fill:#444}
  .tt{font-size:15px;font-weight:bold;fill:#111}
  .warn{font-size:12px;fill:#b03030;font-weight:bold}
  .w{stroke:#333;stroke-width:1.8;fill:none}
  .wp{stroke:#b03030;stroke-width:2.6;fill:none}
  .wg{stroke:#555;stroke-width:2.2;fill:none}
  .wr{stroke:#1e8a5a;stroke-width:1.8;fill:none}
  .wo{stroke:#c47a1a;stroke-width:1.8;fill:none}
  .note{font-size:11px;fill:#666}
</style>

<text x="20" y="28" class="tt" font-size="19">WiPhone "woods" backplate — RFM95W + GPS + 915 MHz whip + expanded battery</text>
<text x="20" y="48" class="note">Pin names from Hardware.h (RFM95_CS 27, RFM95_INT 38) and the pogo-header pinout. Verify every rail with a meter before building.</text>

<!-- ============ POGO HEADER ============ -->
<rect x="30" y="80" width="215" height="330" class="hdr"/>
<text x="42" y="104" class="tt">Pogo header (phone side)</text>
<text x="42" y="122" class="ts">ESP32 block</text>
<line x1="42" y1="130" x2="235" y2="130" stroke="#2b5fa8"/>
<text x="42" y="150" class="t">5V          <tspan class="warn">(verify: USB-only?)</tspan></text>
<text x="42" y="172" class="t">GND</text>
<text x="42" y="194" class="t">GPIO_38  DB_RXD  <tspan class="ts">in-only</tspan></text>
<text x="42" y="216" class="t">GPIO_32  DB_TXD</text>
<text x="42" y="238" class="t">GPIO_12  SPI MISO</text>
<text x="42" y="260" class="t">GPIO_13  SPI MOSI</text>
<text x="42" y="282" class="t">GPIO_14  SPI SCK</text>
<text x="42" y="304" class="t">GPIO_27  SPI CS</text>
<text x="42" y="330" class="ts">SX1509 block</text>
<line x1="42" y1="338" x2="235" y2="338" stroke="#2b5fa8"/>
<text x="42" y="358" class="t">3.3V</text>
<text x="42" y="380" class="t">VB+   <tspan class="ts">(battery rail)</tspan></text>
<text x="42" y="400" class="t">GND</text>

<!-- ============ RFM95W ============ -->
<rect x="420" y="80" width="250" height="240" class="rf"/>
<text x="435" y="104" class="tt">RFM95W (SX1276, 915 MHz)</text>
<text x="435" y="126" class="t">3.3V</text>
<text x="435" y="148" class="t">GND  (both pads)</text>
<text x="435" y="170" class="t">MISO / MOSI / SCK</text>
<text x="435" y="192" class="t">NSS  ← GPIO_27</text>
<text x="435" y="214" class="t">RESET  <tspan class="ts">leave NC (RFM95_RST = -1)</tspan></text>
<text x="435" y="236" class="t">DIO0   <tspan class="warn">LEAVE UNCONNECTED</tspan></text>
<text x="435" y="254" class="note">mesh_phy.cpp polls; it never attaches an ISR,</text>
<text x="435" y="268" class="note">which frees GPIO_38 for the GPS. Wiring DIO0</text>
<text x="435" y="282" class="note">here would fight the GPS TX on the same net.</text>
<text x="435" y="304" class="t">ANA  → antenna (bare pad)</text>

<!-- RF decoupling -->
<rect x="300" y="120" width="90" height="62" class="box"/>
<text x="311" y="140" class="ts">100 nF</text>
<text x="311" y="157" class="ts">+ 10 µF</text>
<text x="311" y="174" class="ts">at 3V3 pin</text>

<!-- ============ ANTENNA CHAIN ============ -->
<rect x="760" y="80" width="380" height="150" class="rf"/>
<text x="775" y="104" class="tt">Antenna chain (the part to get right)</text>
<text x="775" y="128" class="t">ANA → u.FL jack → pigtail → SMA bulkhead → whip</text>
<text x="775" y="150" class="note">The RFM95W has NO u.FL connector — only the ANA pad.</text>
<text x="775" y="166" class="note">Solder a u.FL jack to ANA + adjacent GND, or solder the</text>
<text x="775" y="182" class="note">pigtail centre to ANA and its braid to GND.</text>
<text x="775" y="204" class="warn">Keep ANA→connector under ~5 mm, 50 Ω, ground both sides.</text>
<text x="775" y="222" class="note">Never key up with no antenna fitted — that kills the PA.</text>

<!-- ============ GPS ============ -->
<rect x="420" y="380" width="250" height="150" class="gps"/>
<text x="435" y="404" class="tt">HGLRC M100 Mini GPS</text>
<text x="435" y="428" class="t">5V   ← header 5V</text>
<text x="435" y="450" class="t">GND</text>
<text x="435" y="472" class="t">TX   → GPIO_38  (ESP32 RX)</text>
<text x="435" y="494" class="t">RX   ← GPIO_32  (ESP32 TX)</text>
<text x="435" y="516" class="note">u-blox, UART, NMEA 9600 or 38400 — confirm on the bench.</text>

<rect x="300" y="400" width="90" height="62" class="box"/>
<text x="311" y="420" class="ts">100 nF</text>
<text x="311" y="437" class="ts">+ 47 µF</text>
<text x="311" y="454" class="ts">at 5V pin</text>

<!-- ============ BATTERY ============ -->
<rect x="30" y="470" width="340" height="290" class="bat"/>
<text x="45" y="496" class="tt">Expanded battery — READ THIS FIRST</text>
<text x="45" y="520" class="warn">This exact project destroyed two packs' protection</text>
<text x="45" y="536" class="warn">FETs by paralleling them at unequal charge.</text>
<text x="45" y="558" class="t">Preferred: DO NOT hard-parallel the cells.</text>
<text x="45" y="578" class="note">External pack → boost to 5 V → the phone's own charge</text>
<text x="45" y="594" class="note">input. The onboard charger IC then manages the internal</text>
<text x="45" y="610" class="note">cell, exactly as a power bank would. No cell paralleling,</text>
<text x="45" y="626" class="note">no matched-voltage ritual, no shared-protection failure.</text>
<text x="45" y="650" class="t">If you DO parallel onto VB+:</text>
<text x="45" y="668" class="note">• match within ~50 mV before connecting, every time</text>
<text x="45" y="684" class="note">• both packs 1S, same chemistry, each with its own PCM</text>
<text x="45" y="700" class="note">• fuse or polyfuse in the external leg</text>
<text x="45" y="716" class="note">• a connector, not solder, so it can be split for charging</text>
<text x="45" y="738" class="warn">Charge current is set by the phone's charger — a bigger</text>
<text x="45" y="754" class="warn">pack just charges slower, it does not charge harder.</text>

<!-- ============ WIRES ============ -->
<!-- SPI -->
<path class="wr" d="M245 238 H300 M300 238 V170 H420"/>
<path class="wr" d="M245 260 H285 M285 260 V176 H420"/>
<path class="wr" d="M245 282 H275 M275 282 V182 H420"/>
<path class="wr" d="M245 304 H265 M265 304 V192 H420"/>
<!-- 3v3 to RFM -->
<path class="w" d="M245 358 H262 M262 358 V126 H420"/>
<!-- GND -->
<path class="wg" d="M245 172 H255 M255 172 V148 H420"/>
<!-- ANA to antenna -->
<path class="wr" d="M670 300 H760"/>
<!-- GPS 5V / GND -->
<path class="wo" d="M245 150 H290 M290 150 V428 H420"/>
<path class="wg" d="M245 172 H270 M270 172 V450 H420"/>
<!-- GPS UART -->
<path class="wo" d="M245 194 H410 M410 194 V472 H420"/>
<path class="wo" d="M245 216 H400 M400 216 V494 H420"/>
<!-- battery -->
<path class="wp" d="M245 380 H310 M310 380 V470"/>

<text x="700" y="430" class="tt">Minimum extra parts</text>
<text x="700" y="454" class="t">1 × u.FL jack (or direct pigtail solder)</text>
<text x="700" y="474" class="t">1 × u.FL → SMA bulkhead pigtail</text>
<text x="700" y="494" class="t">1 × 915 MHz SMA whip</text>
<text x="700" y="514" class="t">2 × 100 nF 0402/0603 (RFM 3V3, GPS 5V)</text>
<text x="700" y="534" class="t">1 × 10 µF (RFM 3V3 bulk — TX pulls ~120 mA)</text>
<text x="700" y="554" class="t">1 × 47–100 µF (GPS 5V bulk)</text>
<text x="700" y="574" class="t">1 × polyfuse + connector (external battery leg)</text>
<text x="700" y="594" class="t">optional: 10 kΩ pull-up on RESET</text>
<text x="700" y="614" class="note">No level shifters: ESP32, RFM95W and the GPS UART are</text>
<text x="700" y="630" class="note">all 3.3 V logic. The GPS takes 5 V on its power pin only.</text>

<text x="700" y="676" class="tt">Verify on the bench before committing a PCB</text>
<text x="700" y="700" class="warn">1. Is header 5V live on BATTERY, or only on USB?</text>
<text x="700" y="716" class="note">   If USB-only, the GPS is dead in the woods — which is the</text>
<text x="700" y="732" class="note">   whole point of it. Then feed GPS from 3.3V (check its</text>
<text x="700" y="748" class="note">   regulator accepts it) or add a boost from VB+.</text>
<text x="700" y="770" class="warn">2. Can the 3.3V rail take RFM95W TX peaks?</text>
<text x="700" y="786" class="note">   Measure the rail while transmitting at +20 dBm.</text>
<text x="700" y="808" class="warn">3. Does the screw-terminal plate expose all 8 signals?</text>
<text x="700" y="824" class="note">   MISO/MOSI/SCK/CS/38/32/5V/3V3/GND/VB+ — count them first.</text>
</svg>
