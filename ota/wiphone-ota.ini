; WiPhone OTA manifest — what the phone checks in Settings > Firmware settings.
;
; Two keys, and that is the whole format (parsed by NanoIni in Ota::loadIniFile):
;   version  compared against FIRMWARE_VERSION in config.h. The phone only offers
;            the update when this is HIGHER, so bump config.h and this together.
;   url      the .bin to flash.
;
; Publish with tools/publish_ota.sh — it builds, copies the binary here, and sets
; both fields so they cannot drift apart.
version = 0.8.30
url = https://raw.githubusercontent.com/Nikguy321/wiphone-meshtastic/main/ota/firmware.bin
